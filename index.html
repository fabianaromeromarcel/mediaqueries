<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Media Queries</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="https://kit.fontawesome.com/a05b8d9a94.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav>
        <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/d/dd/Coca-Cola_logo_white.png">
        <ul class="links">
            <li><a href="">Inicio</a></li>
            <li><a href="">Catálogo</a></li>
            <li><a href="">Ofertas</a></li>
            <li><a href="">Contacto</a></li>
        </ul>
        <div class="hamburguesa"><i class="fa-solid fa-bars fa-lg"></i></div>
    </nav>

    <div class="buscador">
        <p>Ordenar por:</p>
        <div class="seleccionador">
            <p>Precio</p>
            <i class="fa-solid fa-angle-down"></i>
        </div>
    </div>

    <main>
        <div class="grilla-card">
            <div class="card">
                <img src="https://mediapool.bmwgroup.com/cache/P9/202401/P90536601/P90536601-mini-cooper-s-02-2024-600px.jpg" alt="Mini">
                <p>Model: City Car</p>
                <button>Ver más</button>
            </div>
            <div class="card-desktop">
                <img src="https://mediapool.bmwgroup.com/cache/P9/202401/P90536601/P90536601-mini-cooper-s-02-2024-600px.jpg" alt="Mini">
                <p>Model: City Car</p>
                <button>Ver más</button>
            </div>
            <div class="card-desktop">
                <img src="https://mediapool.bmwgroup.com/cache/P9/202401/P90536601/P90536601-mini-cooper-s-02-2024-600px.jpg" alt="Mini">
                <p>Model: City Car</p>
                <button>Ver más</button>
            </div>
            <div class="card-desktop">
                <img src="https://mediapool.bmwgroup.com/cache/P9/202401/P90536601/P90536601-mini-cooper-s-02-2024-600px.jpg" alt="Mini">
                <p>Model: City Car</p>
                <button>Ver más</button>
            </div>
            <div class="card-desktop">
                <img src="https://mediapool.bmwgroup.com/cache/P9/202401/P90536601/P90536601-mini-cooper-s-02-2024-600px.jpg" alt="Mini">
                <p>Model: City Car</p>
                <button>Ver más</button>
            </div>
            <div class="card-desktop">
                <img src="https://mediapool.bmwgroup.com/cache/P9/202401/P90536601/P90536601-mini-cooper-s-02-2024-600px.jpg" alt="Mini">
                <p>Model: City Car</p>
                <button>Ver más</button>
            </div>
            <div class="card-desktop">
                <img src="https://mediapool.bmwgroup.com/cache/P9/202401/P90536601/P90536601-mini-cooper-s-02-2024-600px.jpg" alt="Mini">
                <p>Model: City Car</p>
                <button>Ver más</button>
            </div>
        </div>
        <div class="numeros">
            <div class="numero"><i class="fa-solid fa-angles-left fa-xs"></i></div>
            <div class="numero">1</div>
            <div class="numero">2</div>
            <div class="numero">3</div>
            <div class="numero"><i class="fa-solid fa-angles-right fa-xs"></i></div>
        </div>
    </main>

    <footer>
        <div>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
        </div>
        <p>Todos los derechos reservados</p>
    </footer>

</body>
</html>
